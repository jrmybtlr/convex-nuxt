name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect non-playground changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            run:
              - '**'
              - '!playground/**'

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check (Oxfmt + Oxlint)
        run: pnpm check

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: pnpm test

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck playground
        run: pnpm typecheck:playground

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [changes, check, test, typecheck, build]
    if: always()
    steps:
      - name: Require verify jobs when needed
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change detection failed: ${{ needs.changes.result }}"
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.run }}" != "true" ]]; then
            echo "Only playground/** changed — skipping verify jobs"
            exit 0
          fi

          results=(
            "${{ needs.check.result }}"
            "${{ needs.test.result }}"
            "${{ needs.typecheck.result }}"
            "${{ needs.build.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "A required job finished with: $result"
              exit 1
            fi
          done
